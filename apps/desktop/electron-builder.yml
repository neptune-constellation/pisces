appId: com.pisces.desktop
productName: Pisces
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: resources/
    to: .
win:
  executableName: pisces
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  target:
    - dmg
linux:
  executableName: pisces
  target:
    - AppImage
  category: Utility
