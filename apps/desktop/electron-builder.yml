appId: com.pisces.desktop
productName: Pisces
directories:
  output: dist
files:
  - out/**
extraResources:
  - from: resources/
    to: .
win:
  executableName: pisces
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Version-independent name so docs can link to releases/latest/download/<name>
  artifactName: ${productName}-Setup.${ext}
mac:
  icon: build/icon.png
  target:
    - dmg
dmg:
  # Version-independent name so docs can link to releases/latest/download/<name>
  artifactName: ${productName}-${arch}.${ext}
linux:
  executableName: pisces
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
appImage:
  # Version-independent name so docs can link to releases/latest/download/<name>
  artifactName: ${productName}-${arch}.${ext}
